<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendador DomCloud</title>
    <link rel="stylesheet" href="/style.css?v=3">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <!-- Overlay de Carregamento -->
    <div class="global-loader" id="globalLoader" style="display: none;">
        <div class="spinner"></div>
    </div>

    <div class="container">
        <!-- Cabeçalho com botões de navegação de meses -->
        <div class="calendar-header">
            <button type="button" class="btn-nav" onclick="navigate(-1)"><i data-lucide="chevron-left"></i></button>
            <div class="header-center" style="display: flex; align-items: center; gap: 15px;">
                <h2 id="calendar-title" style="margin: 0;">Agendamento</h2>
            </div>
            <button type="button" class="btn-nav" onclick="navigate(1)"><i data-lucide="chevron-right"></i></button>
        </div>

        <div class="view-toggle-container">
            <button type="button" class="btn-toggle-view" onclick="toggleViewMode()">
                <i data-lucide="list" style="width: 18px; height: 18px;"></i> <span>Alternar para modo semana</span>
            </button>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>
        <div class="weekly-list" id="weeklyListView" style="display: none;"></div>
    </div>

    <div class="modal-backdrop" id="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Opções do Dia</h3>
            <div class="error-box" id="errorBox" style="display: none;"></div>

            <div id="viewScheduleSection">
                <h4>Agendamentos Cadastrados:</h4>
                <div id="dayTasksList" class="day-tasks-list"></div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()"><i data-lucide="x"></i>
                        Fechar</button>
                    <button type="button" class="btn-save" onclick="showFormSection()"><i data-lucide="plus"></i>
                        Agendar Novo</button>
                </div>
            </div>

            <form id="taskForm" style="display: none;">
                <label>
                    Tipo de Tarefa:
                    <select id="taskType" disabled>
                        <option value="Oitiva" selected>Oitiva</option>
                    </select>
                </label>
                <label>
                    Primeiro Nome:
                    <input type="text" id="firstName" required placeholder="Ex: João">
                </label>
                <label>
                    Descrição:
                    <input type="text" id="description" required placeholder="Ex: Nº do procedimento">
                </label>
                <label>
                    Horário de Início:
                    <input type="time" id="startTime" required>
                </label>
                <label>
                    Duração Estimada:
                    <select id="duration" required>
                        <option value="30">00:30min</option>
                        <option value="60">01:00H</option>
                        <option value="90">01:30min</option>
                        <option value="120">02:00H</option>
                    </select>
                </label>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="showViewSection()"><i
                            data-lucide="arrow-left"></i> Voltar</button>
                    <button type="submit" class="btn-save" id="btnSubmitForm"><i data-lucide="save"></i> Salvar
                        Agendamento</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let tasks = [];
        let selectedDate = '';
        let editingTaskId = null;

        let viewMode = localStorage.getItem('viewMode') || 'month'; // 'month' ou 'week'
        const todayObj = new Date();
        let currentMonth = todayObj.getMonth();
        let currentYear = todayObj.getFullYear();
        let currentWeekStart = new Date();
        currentWeekStart.setDate(todayObj.getDate() - todayObj.getDay());
        currentWeekStart.setHours(0, 0, 0, 0);

        const monthNames = [
            "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
            "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
        ];
        const weekDayNames = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];

        function getWeekNumberInMonth(date) {
            const firstDay = new Date(date.getFullYear(), date.getMonth(), 1);
            // Corrige o cálculo para que todo domingo (getDay === 0) pule para a próxima semana
            return Math.ceil((date.getDate() + firstDay.getDay()) / 7);
        }

        function updateTitle() {
            if (viewMode === 'month') {
                document.getElementById('calendar-title').innerText = `${monthNames[currentMonth]} de ${currentYear}`;
            } else {
                const endOfWeek = new Date(currentWeekStart);
                endOfWeek.setDate(endOfWeek.getDate() + 6);

                const startMonth = currentWeekStart.getMonth();
                const endMonth = endOfWeek.getMonth();

                if (startMonth === endMonth) {
                    const weekNum = getWeekNumberInMonth(currentWeekStart);
                    document.getElementById('calendar-title').innerText = `Sem. ${weekNum} de ${monthNames[startMonth]}`;
                } else {
                    // Mês de transição
                    const weekNumStart = getWeekNumberInMonth(currentWeekStart);
                    const weekNumEnd = getWeekNumberInMonth(endOfWeek);

                    const shortStartMonth = monthNames[startMonth].substring(0, 3);
                    const shortEndMonth = monthNames[endMonth].substring(0, 3);

                    document.getElementById('calendar-title').innerText = `Sem. ${weekNumStart} ${shortStartMonth} / Sem. ${weekNumEnd} ${shortEndMonth}`;
                }
            }
        }

        function showLoader() { document.getElementById('globalLoader').style.display = 'flex'; }
        function hideLoader() { document.getElementById('globalLoader').style.display = 'none'; }

        function toggleViewMode() {
            viewMode = viewMode === 'month' ? 'week' : 'month';
            localStorage.setItem('viewMode', viewMode);
            applyViewMode();
            loadTasks();
        }

        function applyViewMode() {
            const grid = document.getElementById('calendarGrid');
            const list = document.getElementById('weeklyListView');
            const btn = document.querySelector('.btn-toggle-view');

            if (viewMode === 'week') {
                grid.style.display = 'none';
                list.style.display = 'flex';
                btn.innerHTML = '<i data-lucide="calendar" style="width: 18px; height: 18px;"></i> <span>Alternar para o modo completo</span>';
            } else {
                list.style.display = 'none';
                grid.style.display = '';
                btn.innerHTML = '<i data-lucide="list" style="width: 18px; height: 18px;"></i> <span>Alternar para modo semana</span>';
            }
            if (window.lucide) window.lucide.createIcons();
            updateTitle();
        }

        async function loadTasks() {
            showLoader();
            let url = '';

            if (viewMode === 'month') {
                url = `/api/tasks?month=${currentMonth + 1}&year=${currentYear}`;
            } else {
                const d1 = new Date(currentWeekStart);
                const startStr = `${d1.getFullYear()}-${String(d1.getMonth() + 1).padStart(2, '0')}-${String(d1.getDate()).padStart(2, '0')}`;

                const d2 = new Date(d1);
                d2.setDate(d2.getDate() + 6);
                const endStr = `${d2.getFullYear()}-${String(d2.getMonth() + 1).padStart(2, '0')}-${String(d2.getDate()).padStart(2, '0')}`;

                url = `/api/tasks?startDate=${startStr}&endDate=${endStr}`;
            }

            const res = await fetch(url);
            if (res.ok) {
                tasks = await res.json();
                if (viewMode === 'month') {
                    renderCalendar();
                } else {
                    renderWeeklyList();
                }
            }
            hideLoader();
        }

        function navigate(offset) {
            if (viewMode === 'month') {
                currentMonth += offset;
                if (currentMonth > 11) {
                    currentMonth = 0;
                    currentYear++;
                } else if (currentMonth < 0) {
                    currentMonth = 11;
                    currentYear--;
                }
            } else {
                currentWeekStart.setDate(currentWeekStart.getDate() + (offset * 7));
            }
            updateTitle();
            loadTasks();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            // 1. Renderiza os cabeçalhos dos dias da semana
            const dayHeaders = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
            dayHeaders.forEach(dayName => {
                const header = document.createElement('div');
                header.className = 'calendar-day-header';
                header.innerText = dayName;
                grid.appendChild(header);
            });

            // 2. Calcula o dia da semana em que o mês começa e o total de dias
            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            // 3. Preenche os espaços em branco caso o mês não comece no Domingo
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCard = document.createElement('div');
                emptyCard.className = 'day-card empty';
                grid.appendChild(emptyCard);
            }

            // 4. Renderiza os cartões dos dias reais do mês
            for (let day = 1; day <= daysInMonth; day++) {
                const dayStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

                const dayCard = document.createElement('div');
                dayCard.className = 'day-card';

                // Destaca se for o dia de hoje
                if (todayObj.getDate() === day && todayObj.getMonth() === currentMonth && todayObj.getFullYear() === currentYear) {
                    dayCard.classList.add('today');
                }

                dayCard.onclick = () => openModal(dayStr);

                const dayNumber = document.createElement('span');
                dayNumber.className = 'day-number';
                dayNumber.innerText = day;
                dayCard.appendChild(dayNumber);

                const indicators = document.createElement('div');
                indicators.className = 'task-indicators';

                // Filtra e ordena as tarefas do dia pelo horário de início
                const dayTasks = tasks.filter(t => t.date === dayStr);
                dayTasks.sort((a, b) => a.startTime.localeCompare(b.startTime));

                dayTasks.forEach(task => {
                    const badge = document.createElement('div');
                    badge.className = 'task-badge';
                    badge.innerText = `${task.startTime} - ${task.firstName}`;
                    indicators.appendChild(badge);
                });

                dayCard.appendChild(indicators);
                grid.appendChild(dayCard);
            }
        }

        function renderWeeklyList() {
            const list = document.getElementById('weeklyListView');
            list.innerHTML = '';

            for (let i = 0; i < 7; i++) {
                const currentDate = new Date(currentWeekStart);
                currentDate.setDate(currentDate.getDate() + i);

                const dayStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(currentDate.getDate()).padStart(2, '0')}`;

                const row = document.createElement('div');
                row.className = 'week-day-row';

                if (todayObj.getDate() === currentDate.getDate() && todayObj.getMonth() === currentDate.getMonth() && todayObj.getFullYear() === currentDate.getFullYear()) {
                    row.classList.add('today');
                }

                row.onclick = () => openModal(dayStr);

                const dayLabel = document.createElement('div');
                dayLabel.className = 'week-day-label';
                dayLabel.innerHTML = `<strong>${String(currentDate.getDate()).padStart(2, '0')}</strong> - ${weekDayNames[i]}`;
                row.appendChild(dayLabel);

                const tasksContainer = document.createElement('div');
                tasksContainer.className = 'week-day-tasks';

                const dayTasks = tasks.filter(t => t.date === dayStr);
                dayTasks.sort((a, b) => a.startTime.localeCompare(b.startTime));

                dayTasks.forEach(task => {
                    const badge = document.createElement('div');
                    badge.className = 'task-badge';
                    const nameStr = task.firstName.length > 12 ? task.firstName.substring(0, 12) + '...' : task.firstName;
                    badge.innerText = `${task.startTime} - ${nameStr}`;
                    tasksContainer.appendChild(badge);
                });

                row.appendChild(tasksContainer);
                list.appendChild(row);
            }
        }

        function openModal(date) {
            selectedDate = date;
            editingTaskId = null;
            document.getElementById('modalTitle').innerText = `Data: ${date.split('-').reverse().join('/')}`;
            document.getElementById('errorBox').style.display = 'none';

            showViewSection();
            document.getElementById('modal').style.display = 'flex';
        }

        function showViewSection() {
            document.getElementById('taskForm').style.display = 'none';
            document.getElementById('viewScheduleSection').style.display = 'block';

            const listContainer = document.getElementById('dayTasksList');
            listContainer.innerHTML = '';

            const dayTasks = tasks.filter(t => t.date === selectedDate);
            dayTasks.sort((a, b) => a.startTime.localeCompare(b.startTime));

            if (dayTasks.length === 0) {
                listContainer.innerHTML = '<p class="no-tasks">Nenhum agendamento para este dia.</p>';
            } else {
                dayTasks.forEach(task => {
                    const item = document.createElement('div');
                    item.className = 'task-list-item';
                    item.innerHTML = `
                        <div class="task-info">
                            <strong>${task.startTime} às ${task.endTime}</strong> - ${task.taskType} ${task.firstName}
                            <div class="task-desc-text">${task.description}</div>
                        </div>
                        <div class="task-actions-inline">
                            <button type="button" class="btn-inline-edit" onclick="startEditTask(${task.id})" title="Editar"><i data-lucide="edit-2" style="width: 16px; height: 16px;"></i></button>
                            <button type="button" class="btn-inline-delete" onclick="deleteTask(${task.id})" title="Excluir"><i data-lucide="trash-2" style="width: 16px; height: 16px;"></i></button>
                        </div>
                    `;
                    listContainer.appendChild(item);
                });
            }
            if (window.lucide) window.lucide.createIcons();
        }

        function showFormSection() {
            document.getElementById('viewScheduleSection').style.display = 'none';
            document.getElementById('taskForm').style.display = 'block';
            document.getElementById('btnSubmitForm').innerHTML = editingTaskId ? '<i data-lucide="save"></i> Atualizar Agendamento' : '<i data-lucide="save"></i> Salvar Agendamento';
            if (window.lucide) window.lucide.createIcons();
        }

        function startEditTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            editingTaskId = id;
            document.getElementById('firstName').value = task.firstName;
            document.getElementById('description').value = task.description;
            document.getElementById('startTime').value = task.startTime;
            document.getElementById('duration').value = task.durationMinutes;

            showFormSection();
        }

        async function deleteTask(id) {
            if (!confirm('Deseja realmente excluir este agendamento?')) return;

            showLoader();
            const res = await fetch(`/api/tasks?id=${id}`, { method: 'DELETE' });
            if (res.ok) {
                tasks = tasks.filter(t => t.id !== id);
                if (viewMode === 'month') {
                    renderCalendar();
                } else {
                    renderWeeklyList();
                }
                showViewSection();
            } else {
                alert('Erro ao excluir tarefa.');
            }
            hideLoader();
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('taskForm').reset();
            editingTaskId = null;
        }

        document.getElementById('taskForm').onsubmit = async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('errorBox');
            errorBox.style.display = 'none';
            showLoader();

            const payload = {
                date: selectedDate,
                taskType: 'Oitiva',
                firstName: document.getElementById('firstName').value,
                description: document.getElementById('description').value,
                startTime: document.getElementById('startTime').value,
                durationMinutes: parseInt(document.getElementById('duration').value)
            };

            const isEditing = editingTaskId !== null;
            if (isEditing) payload.id = editingTaskId;

            const res = await fetch('/api/tasks', {
                method: isEditing ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await res.json();

            if (!res.ok) {
                errorBox.innerText = result.message;
                errorBox.style.display = 'block';
                hideLoader();
                return;
            }

            if (isEditing) {
                tasks = tasks.map(t => t.id === editingTaskId ? result.task : t);
            } else {
                tasks.push(result.task);
            }

            if (viewMode === 'month') {
                renderCalendar();
            } else {
                renderWeeklyList();
            }

            closeModal();
            hideLoader();
        };

        // Inicialização
        applyViewMode();
        loadTasks();
        if (window.lucide) window.lucide.createIcons();
    </script>
</body>

</html>
